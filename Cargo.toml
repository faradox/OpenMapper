[workspace]
resolver = "3"
members = ["crates/om-core", "crates/om-render", "crates/om-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
om-core = { path = "crates/om-core" }
om-render = { path = "crates/om-render" }
# eframe defaults give us wgpu, clipboard, accessibility, X11 + Wayland and system fonts.
eframe = { version = "0.37", features = ["persistence"] }
# Bundled monochrome emoji so icon glyphs render identically on macOS, Windows and Linux.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
wgpu = "30"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga"] }
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Dependencies are optimized even in dev builds so image decoding and
# rendering stay responsive while iterating on our own code.
[profile.dev.package."*"]
opt-level = 2
